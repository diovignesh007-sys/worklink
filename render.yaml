# Render.com Blueprint — deploys the full WorkLink stack in one click:
#   https://dashboard.render.com/blueprints → "New Blueprint Instance" → pick this repo.
# Provisions: Postgres + 2 web services (API, web). Redis omitted —
# the API falls back to an in-memory KV (fine to start; add a Render Redis key
# REDIS_URL later for multi-instance rate limits/OTP).

databases:
  - name: worklink-db
    databaseName: worklink
    user: worklink
    plan: free
    postgresMajorVersion: "16"

services:
  # ── API (Fastify + embedded fallback OFF; uses managed Postgres) ─────────
  - type: web
    name: worklink-api
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/api
    buildCommand: npm install -g pnpm@9 --silent && cd ../.. && pnpm install --no-frozen-lockfile && pnpm --filter @worklink/types build && pnpm --filter @worklink/api build
    startCommand: node dist/index.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: worklink-db
          property: connectionString
      - key: WORKLINK_EMBEDDED_DB
        value: "0"
      - key: CORS_ORIGIN
        value: https://worklink-web.onrender.com
      - key: API_BASE_URL
        value: https://worklink-api.onrender.com/api/v1
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_CHANNEL
        value: console
      - key: EMAIL_DRIVER
        value: console
      - key: STORAGE_DRIVER
        value: local
      - key: PAYMENTS_ENABLED
        value: "0"
      - key: LOG_LEVEL
        value: info

  # ── Web (Next.js standalone) ─────────────────────────────────────────────
  - type: web
    name: worklink-web
    runtime: node
    plan: free
    region: oregon
    rootDir: apps/web
    # Build from the workspace root (pnpm needs the lockfile); `next start`
    # serves apps/web/.next directly — no standalone-copy pitfalls.
    buildCommand: npm install -g pnpm@9 --silent && cd ../.. && pnpm install --no-frozen-lockfile && pnpm --filter @worklink/types build && pnpm --filter @worklink/web build
    startCommand: npx next start -p $PORT
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://worklink-api.onrender.com/api/v1
      # Next needs these at build time for client bundles
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"

# Demo data (30 users, 60 jobs, demo@worklink.app / Worklink1) seeds automatically
# on first API boot (SEED_ON_BOOT=1 default) — no separate seed job is needed.
# If you rename services above, update CORS_ORIGIN (api) and
# NEXT_PUBLIC_API_BASE_URL (web) to match.
