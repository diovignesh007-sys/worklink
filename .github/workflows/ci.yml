name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: worklink
          POSTGRES_PASSWORD: worklink
          POSTGRES_DB: worklink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U worklink"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgres://worklink:worklink@localhost:5432/worklink_test
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-32
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-32
      CORS_ORIGIN: http://localhost:3000
      STORAGE_DRIVER: local
      MAP_PROVIDER: none
      OTP_CHANNEL: console
      EMAIL_DRIVER: console
      PAYMENTS_ENABLED: "0"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate database
        run: pnpm db:migrate

      - name: Unit + integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/api/coverage
          if-no-files-found: ignore
