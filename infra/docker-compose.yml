version: "3.9"

# WorkLink local infrastructure.
#   docker compose up -d        → Postgres(+PostGIS), Redis, MinIO
#   docker compose up           → …plus api & web services (built from Dockerfiles)
#
# Without Docker, the API auto-starts an embedded Postgres (see DECISIONS.md).

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: worklink-postgres
    environment:
      POSTGRES_USER: worklink
      POSTGRES_PASSWORD: worklink
      POSTGRES_DB: worklink
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U worklink -d worklink"]
      interval: 5s
      timeout: 3s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: worklink-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    container_name: worklink-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (mc alias local http://minio:9000 --quiet) do sleep 1; done;
      mc mb --ignore-existing local/worklink-media;
      mc anonymous set download local/worklink-media;
      exit 0
      "

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: worklink-api
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://worklink:worklink@postgres:5432/worklink
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      JWT_ACCESS_SECRET: change-me-in-production-access
      JWT_REFRESH_SECRET: change-me-in-production-refresh
      CORS_ORIGIN: http://localhost:3000
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: worklink-media
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "4000:4000"

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    container_name: worklink-web
    profiles: ["full"]
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
      API_BASE_URL: http://api:4000/api/v1
    ports:
      - "3000:3000"

volumes:
  pgdata:
  redisdata:
  miniodata:
